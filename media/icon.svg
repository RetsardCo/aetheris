<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="20" fill="#070a10"/>
  <circle cx="50" cy="50" r="40" fill="url(#glow)"/>
  
  <!-- Orbital ring -->
  <ellipse cx="50" cy="50" rx="38" ry="16" fill="none" stroke="#1e293b" stroke-width="1.5" transform="rotate(-20 50 50)"/>
  <circle cx="20" cy="40" r="2.5" fill="#f59e0b"/>

  <!-- Octahedron wireframe -->
  <polygon points="50,18 78,50 50,82 22,50" fill="none" stroke="url(#crystalGrad)" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="22" y1="50" x2="78" y2="50" stroke="#06b6d4" stroke-width="1.5"/>
  <line x1="50" y1="18" x2="50" y2="82" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/>
  <polygon points="50,18 64,50 50,82 36,50" fill="rgba(6, 182, 212, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Center node -->
  <circle cx="50" cy="50" r="3" fill="#ffffff"/>
</svg>
