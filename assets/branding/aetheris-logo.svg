  <circle cx="218" cy="204" r="31" fill="#50bdf6" opacity=".22" filter="url(#soft)"/><path d="M218 168 L247 185 L247 219 L218 236 L189 219 L189 185 Z" fill="#182f4b" stroke="url(#aether)" stroke-width="2.4"/><path d="M218 178 L238 190 L238 214 L218 226 L198 214 L198 190 Z" fill="url(#core)" filter="url(#glow)"/><path d="M208 194 L218 188 L228 194 L228 206 L218 212 L208 206 Z" fill="#efffff" opacity=".95"/>
