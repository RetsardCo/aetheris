<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Aetheris — AI Activity Observatory</title>
  <desc id="desc">A luminous teal and violet orbital constellation surrounding a central core, paired with the Aetheris wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111a31"/></linearGradient>
    <linearGradient id="aether" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#74f7e8"/><stop offset=".52" stop-color="#50bdf6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#a9d9ed"/></linearGradient>
    <radialGradient id="core" cx="35%" cy="25%" r="80%"><stop offset="0" stop-color="#f4ffff"/><stop offset=".25" stop-color="#74f7e8"/><stop offset=".7" stop-color="#50bdf6"/><stop offset="1" stop-color="#8069e9"/></radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="420" rx="34" fill="url(#bg)"/><circle cx="218" cy="210" r="126" fill="#4bdccf" opacity=".08" filter="url(#soft)"/>
