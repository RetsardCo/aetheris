  <g transform="translate(1058 95)" stroke="url(#aether)" stroke-linecap="round" opacity=".55"><path d="M0 0 V35 M14 10 V35 M28 -6 V35 M42 16 V35 M56 2 V35" stroke-width="3"/><path d="M-4 46 H62" stroke-width="1.5"/></g>
